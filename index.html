<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9fd2ee">
  <meta name="robots" content="noindex, nofollow">
  <title>ALL IN ONE | a fool hippo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="gate" id="gate">
      <div class="gate__box">
        <p class="eyebrow">a fool hippo</p>
        <h1>ALL IN ONE</h1>
        <p>約500曲をまとめた、<br>合言葉を知っている方のための音楽室です。</p>
        <form id="loginForm">
          <label for="password">合言葉</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">音楽室へ入る</button>
          <p class="error" id="loginError" role="alert" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section class="library" id="library" hidden>
      <header class="library__header">
        <p class="eyebrow">a fool hippo</p>
        <h1>ALL IN ONE</h1>
        <p>アルバムを開いて、好きなところからどうぞ。</p>
        <label class="search">
          <span>アルバム・曲名を検索</span>
          <input id="searchInput" type="search" placeholder="例：帰り道">
        </label>
      </header>
      <div class="album-list" id="albumList"></div>
      <p class="no-results" id="noResults" hidden>見つかりませんでした。</p>
      <footer>
        <button class="logout" id="logoutButton" type="button">入口へ戻る</button>
        <p>© a fool hippo</p>
      </footer>
    </section>
  </main>
  <script src="albums-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
